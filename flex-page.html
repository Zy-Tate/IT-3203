<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flex Page</title>
    <style>
        header, nav, main, footer, section {
            border: 1px solid #eeeeee;
            padding: 10px;
            margin: 2px;
        }
        main {
            display: flex;
        }
        .mainSection {
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <h1>Flex Page</h1>
</header>

<nav>
    menu
</nav>

<main>
    <section class="left">left part</section>
    <section class="mainSection">main part</section>
    <section class="right">right part</section>
</main>

<footer>
    footer part
</footer>

</body>
</html>
